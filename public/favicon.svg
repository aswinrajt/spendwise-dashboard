<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#095c55"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Brand Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#sw-bg)"/>

  <!-- Gold Coin -->
  <g filter="url(#glow)">
    <circle cx="32" cy="17" r="9" fill="url(#gold-grad)"/>
    <circle cx="32" cy="17" r="7.4" fill="none" stroke="#b45309" stroke-width="0.8" stroke-dasharray="1.2 0.8"/>
    <text x="32" y="20.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="-0.3">SW</text>
  </g>

  <!-- Piggy Bank -->
  <g filter="url(#glow)" transform="translate(14, 23) scale(1.5)">
    <!-- Body -->
    <path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-1.5 1.5-.7 2-2 2-3.5 0-3-2-6-5-6" fill="#ffffff"/>
    <!-- Snout & tail -->
    <path d="M2 9v1c0 1.1.9 2 2 2h1" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Eye -->
    <circle cx="16" cy="11" r="1.1" fill="#0d9488"/>
    <!-- Slot -->
    <rect x="8.5" y="4.5" width="4.5" height="1.2" rx="0.6" fill="#0d9488"/>
  </g>
</svg>
